name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - keyboard: splitkb/kyria/rev1
            keymap: diaoul
          - keyboard: splitkb/aurora/corne/rev1
            keymap: diaoul
          # The old bastardkb/skeletyl/v2/* targets are aliased upstream to the
          # AVR promicro board, so building them silently produced ATmega
          # firmware. The Splinky is an RP2040 Community Edition controller, so
          # build the promicro target through the rp2040_ce converter instead.
          - keyboard: bastardkb/skeletyl/promicro
            keymap: diaoul
            convert: rp2040_ce
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-avr binutils-avr avr-libc gcc-arm-none-eabi

      - name: Install QMK CLI
        run: pip3 install qmk

      - name: Set up QMK submodules
        working-directory: qmk/qmk_firmware
        env:
          QMK_HOME: ${{ github.workspace }}/qmk/qmk_firmware
        run: qmk git-submodule

      - name: Lint ${{ matrix.keyboard }}:${{ matrix.keymap }}
        env:
          QMK_HOME: ${{ github.workspace }}/qmk/qmk_firmware
          QMK_USERSPACE: ${{ github.workspace }}/qmk
        run: |
          out=$(qmk lint -kb ${{ matrix.keyboard }} -km ${{ matrix.keymap }} --strict 2>&1) || true
          echo "$out"
          # Upstream ships keyboards/splitkb/aurora/corne/glcdfont.c without a
          # license header. That file lives in the qmk_firmware submodule, so we
          # cannot fix it; ignore that one finding and fail on anything else.
          #
          # TODO: remove this filter once qmk/qmk_firmware#26382 is merged and
          # the submodule has been bumped past it. The grep below then matches
          # nothing, so lint stays correct either way — it is dead weight, not a
          # silent hole. Check with:
          #   gh pr view 26382 --repo qmk/qmk_firmware --json state,mergedAt
          bad=$(echo "$out" | grep '☒' \
              | grep -v 'splitkb/aurora/corne/glcdfont.c' \
              | grep -vc 'Lint check failed for:' || true)
          if [ "$bad" -gt 0 ]; then
            echo "::error::qmk lint reported $bad finding(s)"
            exit 1
          fi

      - name: Compile ${{ matrix.keyboard }}:${{ matrix.keymap }}
        env:
          QMK_HOME: ${{ github.workspace }}/qmk/qmk_firmware
          QMK_USERSPACE: ${{ github.workspace }}/qmk
        run: >-
          qmk compile -kb ${{ matrix.keyboard }} -km ${{ matrix.keymap }}
          ${{ matrix.convert && format('-e CONVERT_TO={0}', matrix.convert) || '' }}
